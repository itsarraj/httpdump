[package]
name = "httpdump"
version = "0.1.0"
edition = "2021"
description = "A fast, headless HTTP server that accepts all requests and dumps them to stdout"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/httpdump"
readme = "README.md"
keywords = ["http", "dump", "testing", "cli"]
categories = ["command-line-utilities"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
